name: AWS deployment and inspection

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed AWS operation
        required: true
        default: site-status
        type: choice
        options:
          - deploy
          - plan
          - refresh-plan
          - site-status

permissions:
  contents: read

concurrency:
  group: henrybissonnette-aws-operations
  cancel-in-progress: false
  queue: max

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
    steps:
      - name: Check out exact event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up declared Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.15
      - name: Resolve fixed operation and source identity
        id: resolve
        env:
          INPUT_OPERATION: ${{ github.event.inputs.operation || '' }}
        run: python3 scripts/workflow_gate.py --github-output "$GITHUB_OUTPUT"
      - name: Validate static publication
        run: python3 scripts/check_site.py
      - name: Validate infrastructure source
        run: scripts/check_infrastructure.sh
      - name: Validate workflow boundary and sentinels
        run: python3 -m unittest discover -s tests -v

  aws-operation:
    needs: source-validation
    if: needs.source-validation.result == 'success' && needs.source-validation.outputs.operation != '' && vars.AWS_BOOTSTRAPPED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up declared Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.15
      - name: Install pinned authority-path tools before AWS credentials
        env:
          TOOL_CACHE_ROOT: ${{ runner.temp }}/tools
        run: |
          terraform_binary=$(python3 scripts/install_tool.py terraform)
          python3 scripts/install_aws_cli.py --install-root "$RUNNER_TEMP/aws-cli" --bin-dir "$RUNNER_TEMP/aws-bin"
          printf 'TERRAFORM_BIN=%s\n' "$terraform_binary" >> "$GITHUB_ENV"
          printf 'AWS_BIN=%s\n' "$RUNNER_TEMP/aws-bin/aws" >> "$GITHUB_ENV"
      - name: Exchange exact-main OIDC identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::241077340022:role/henrybissonnette-github-apply
          aws-region: us-east-1
          role-duration-seconds: 7200
          output-credentials: false
          mask-aws-account-id: false
      - name: Execute fixed operation with private custody
        env:
          FIXED_OPERATION: ${{ needs.source-validation.outputs.operation }}
        run: python3 scripts/run_aws_operation.py --operation "$FIXED_OPERATION"
